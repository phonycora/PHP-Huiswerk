<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekenoefeningen</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Rekenoefeningen</h1>

    <section>
        <h2>Optellen</h2>
        <input id="getal1" type="number" value="1" aria-label="Eerste getal">
        <input id="getal2" type="number" value="12" aria-label="Tweede getal">
        <button id="calculate-button" type="button">Tel op</button>
    </section>

    <section>
        <h2>Vermenigvuldigen met vijf</h2>
        <input id="vermenigvuldig-getal" type="number" value="7" aria-label="Getal om met vijf te vermenigvuldigen">
        <button id="multiply-button" type="button">Vermenigvuldig</button>
    </section>

    <section>
        <h2>Seconden naar minuten</h2>
        <input id="seconden" type="number" value="3600" aria-label="Aantal seconden">
        <button id="minutes-button" type="button">Bereken minuten</button>
    </section>
</body>
</html>
